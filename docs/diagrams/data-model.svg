amily="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">1 : N</text><rect x="1015.6" y="527.0" width="48.8" height="22" rx="4" fill="#fff" fill-opacity="0.95"/><text x="1040.0" y="542.5" text-anchor="middle" font-size="12" fill="#0b6bf0" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">1 : N</text><rect x="966.64" y="119.0" width="146.72" height="22" rx="4" fill="#fff" fill-opacity="0.95"/><text x="1040.0" y="134.5" text-anchor="middle" font-size="12" fill="#8a94a6" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif">1 : N(パスの前方一致)</text><rect x="375.16" y="494.0" width="69.67999999999999" height="22" rx="4" fill="#fff" fill-opacity="0.95"/><text x="410.0" y="509.5" text-anchor="middle" font-size="12" fill="#8a94a6" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">assignee</text><rect x="1232.56" y="459.0" width="34.879999999999995" height="22" rx="4" fill="#fff" fill-opacity="0.95"/><text x="1250.0" y="474.5" text-anchor="middle" font-size="12" fill="#8a94a6" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">GFK</text><text x="40" y="720.0" text-anchor="start" font-size="12.5" fill="#1b2230" font-weight="700" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif">読み方</text><text x="40" y="745.0" text-anchor="start" font-size="12.5" fill="#5b6678" font-weight="400" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif">・1 つのアセットに、工程ごとに 1 つのタスク(UK (entity, step))。</text><text x="40" y="762.5" text-anchor="start" font-size="12.5" fill="#5b6678" font-weight="400" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif">・版の番号はタスクの中で 1, 2, 3 …(行ロックで採番)。</text><text x="40" y="780.0" text-anchor="start" font-size="12.5" fill="#5b6678" font-weight="400" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif">・品質・画面差分は取り込んだ結果の保存先(参照用。編集しない)。</text><text x="40" y="797.5" text-anchor="start" font-size="12.5" fill="#5b6678" font-weight="400" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif">・ノートは外部キーでなく ContentType + id なので、</text><text x="40" y="815.0" text-anchor="start" font-size="12.5" fill="#5b6678" font-weight="400" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif">  対象を消すと一緒に消えるよう GenericRelation を持たせてある。</text><text x="450" y="800.0" text-anchor="start" font-size="12.5" fill="#5b6678" font-weight="400" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif">派生する値は保存しない(進捗・件数・期限切れ・次に行ける状態は計算する)。</text></svg>
