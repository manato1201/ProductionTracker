e="14" font-weight="700" fill="#1b2230" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">Access を通った端末</text><text x="130" y="469.0" text-anchor="middle" font-size="11" fill="#5b6678" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" paint-order="stroke" stroke="#fff" stroke-width="4">Cloudflare Access</text><rect x="98.0" y="538.0" width="64" height="64" rx="12" fill="#fff" stroke="#c9d1de" stroke-width="1.6" stroke-dasharray="5 4"/><g transform="translate(130,570) scale(0.9)"><path d="M-6 -17 V-6 M6 -17 V-6 M-11 -6 H11 V2 C11 9 6 12 0 12 C-6 12 -11 9 -11 2 Z M0 12 V18" fill="none" stroke="#1b2230" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="130" y="622.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2230" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">DCC パネル(未実装)</text><text x="130" y="639.0" text-anchor="middle" font-size="11" fill="#5b6678" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">Houdini など</text><rect x="98.0" y="708.0" width="64" height="64" rx="12" fill="#fff" stroke="#c9d1de" stroke-width="1.6"/><g transform="translate(130,740) scale(0.9)"><rect x="-18" y="-14" width="36" height="28" rx="3" fill="none" stroke="#1b2230" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-11 -5 L-5 0 L-11 5 M0 6 H9" fill="none" stroke="#1b2230" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="130" y="792.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2230" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">外部ツール</text><text x="130" y="809.0" text-anchor="middle" font-size="11" fill="#5b6678" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">取り込みスクリプト</text><rect x="420" y="120" width="640" height="760" rx="14" fill="#f2faf5" stroke="#3da86a" stroke-width="1.6"/><rect x="438" y="108" width="270.96" height="24" fill="#fff" rx="4"/><text x="450" y="125" font-size="14" font-weight="700" fill="#1d7a47" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif">Django: 認証クラスを上から順に試す</text><text x="450" y="148" font-size="11.5" fill="#5b6678" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">REST_FRAMEWORK[&#x27;DEFAULT_AUTHENTICATION_CLASSES&#x27;]</text><rect x="708.0" y="218.0" width="64" height="64" rx="12" fill="#fff" stroke="#c9d1de" stroke-width="1.6"/><g transform="translate(740,250) scale(0.9)"><path d="M0 -17 L15 -11 V2 C15 11 7 16 0 19 C-7 16 -15 11 -15 2 V-11 Z" fill="none" stroke="#1b2230" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-6 1 L-1 6 L7 -4" fill="none" stroke="#1b2230" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="740" y="302.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2230" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">SessionAuthentication401</text><text x="740" y="319.0" text-anchor="middle" font-size="11" fill="#5b6678" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">セッション + CSRF</text><text x="740" y="334.0" text-anchor="middle" font-size="11" fill="#5b6678" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">(未認証は 401)</text><rect x="708.0" y="378.0" width="64" height="64" rx="12" fill="#fff" stroke="#c9d1de" stroke-width="1.6" stroke-dasharray="5 4"/><g transform="translate(740,410) scale(0.9)"><rect x="-13" y="-4" width="26" height="20" rx="3" fill="none" stroke="#1b2230" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -4 V-9 C-8 -19 8 -19 8 -9 V-4" fill="none" stroke="#1b2230" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="740" y="462.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2230" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">CloudflareAccessAuthentication</text><text x="740" y="479.0" text-anchor="middle" font-size="11" fill="#5b6678" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">JWT(RS256)の署名・発行者・宛先・期限</text><text x="740" y="494.0" text-anchor="middle" font-size="11" fill="#5b6678" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">メールで既存ユーザーに対応づけ</text><rect x="708.0" y="548.0" width="64" height="64" rx="12" fill="#fff" stroke="#c9d1de" stroke-width="1.6"/><g transform="translate(740,580) scale(0.9)"><path d="M-6 -16 C-12 -16 -9 -4 -14 0 C-9 4 -12 16 -6 16 M6 -16 C12 -16 9 -4 14 0 C9 4 12 16 6 16" fill="none" stroke="#1b2230" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="740" y="632.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2230" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">TokenAuthentication</text><text x="740" y="649.0" text-anchor="middle" font-size="11" fill="#5b6678" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">Authorization: Token &lt;ユーザー別&gt;</text><text x="740" y="664.0" text-anchor="middle" font-size="11" fill="#5b6678" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">(期限なし・要確認)</text><rect x="708.0" y="718.0" width="64" height="64" rx="12" fill="#fff" stroke="#c9d1de" stroke-width="1.6"/><g transform="translate(740,750) scale(0.9)"><rect x="-18" y="-14" width="36" height="28" rx="3" fill="none" stroke="#1b2230" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-11 -5 L-5 0 L-11 5 M0 6 H9" fill="none" stroke="#1b2230" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="740" y="802.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2230" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">IngestApiKeyAuthentication</text><text x="740" y="819.0" text-anchor="middle" font-size="11" fill="#5b6678" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">X-API-Key(取り込み API 専用)</text><text x="740" y="834.0" text-anchor="middle" font-size="11" fill="#5b6678" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">定数時間で比較</text><polyline points="162,230 698,230" fill="none" stroke="#0b6bf0" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-0b6bf0)"/><polyline points="162,400 676,400" fill="none" stroke="#8a94a6" stroke-width="2" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#arrow-8a94a6)"/><polyline points="162,570 676,570" fill="none" stroke="#8a94a6" stroke-width="2" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#arrow-8a94a6)"/><polyline points="162,740 676,740" fill="none" stroke="#0b6bf0" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-0b6bf0)"/><rect x="1298.0" y="368.0" width="64" height="64" rx="12" fill="#fff" stroke="#c9d1de" stroke-width="1.6"/><g transform="translate(1330,400) scale(0.9)"><circle cx="0" cy="-8" r="7" fill="none" stroke="#1b2230" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-15 17 C-15 5 15 5 15 17" fill="none" stroke="#1b2230" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1330" y="452.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2230" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">request.user</text><text x="1330" y="469.0" text-anchor="middle" font-size="11" fill="#5b6678" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">Django の User</text><text x="1330" y="484.0" text-anchor="middle" font-size="11" fill="#5b6678" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">(役割はプロジェクトごと)</text><rect x="1298.0" y="718.0" width="64" height="64" rx="12" fill="#fff" stroke="#c9d1de" stroke-width="1.6"/><g transform="translate(1330,750) scale(0.9)"><rect x="-18" y="-14" width="36" height="28" rx="3" fill="none" stroke="#1b2230" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-11 -5 L-5 0 L-11 5 M0 6 H9" fill="none" stroke="#1b2230" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1330" y="802.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2230" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">IngestPrincipal</text><text x="1330" y="819.0" text-anchor="middle" font-size="11" fill="#5b6678" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">ユーザーではない外部ツール</text><text x="1330" y="834.0" text-anchor="middle" font-size="11" fill="#5b6678" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">(画面の API は呼べない)</text><polyline points="782,250 1100,250 1100,400 1298,400" fill="none" stroke="#0b6bf0" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-0b6bf0)"/><polyline points="812,410 1100,410" fill="none" stroke="#0b6bf0" stroke-width="2" stroke-linejoin="round"/><polyline points="782,580 1100,580 1100,400" fill="none" stroke="#0b6bf0" stroke-width="2" stroke-linejoin="round"/><polyline points="812,750 1298,750" fill="none" stroke="#0b6bf0" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-0b6bf0)"/><rect x="1120" y="880" width="440" height="100" rx="14" fill="#fdf4f2" stroke="#d9675a" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="1138" y="868" width="202.35999999999999" height="24" fill="#fff" rx="4"/><text x="1150" y="885" font-size="14" font-weight="700" fill="#a8352a" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif">どれにも当たらない / 失敗</text><rect x="318.6" y="219.0" width="222.79999999999998" height="22" rx="4" fill="#fff" fill-opacity="0.95"/><text x="430.0" y="234.5" text-anchor="middle" font-size="12" fill="#0b6bf0" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">Cookie sessionid + X-CSRFToken</text><rect x="306.26" y="389.0" width="174.07999999999998" height="22" rx="4" fill="#fff" fill-opacity="0.95"/><text x="393.3" y="404.5" text-anchor="middle" font-size="12" fill="#8a94a6" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">Cf-Access-Jwt-Assertion</text><rect x="335.44" y="559.0" width="167.11999999999998" height="22" rx="4" fill="#fff" fill-opacity="0.95"/><text x="419.0" y="574.5" text-anchor="middle" font-size="12" fill="#8a94a6" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif">Authorization: Token …</text><rect x="380.68" y="729.0" width="76.63999999999999" height="22" rx="4" fill="#fff" fill-opacity="0.95"/><text x="419.0" y="744.5" text-anchor="middle" font-size="12" fill="#0b6bf0" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">X-API-Key</text><circle cx="560" cy="200" r="12" fill="#0b6bf0"/><text x="560" y="204.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif">1</text><circle cx="590" cy="372" r="12" fill="#8a94a6"/><text x="590" y="376.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif">2</text><circle cx="590" cy="542" r="12" fill="#8a94a6"/><text x="590" y="546.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif">3</text><circle cx="560" cy="712" r="12" fill="#0b6bf0"/><text x="560" y="716.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif">4</text><text x="1140" y="935" text-anchor="start" font-size="12" fill="#c0392b" font-weight="400" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif">401: 認証情報なし・不正   403: Access は通ったが未登録 / CSRF 失敗</text><text x="40" y="930.0" text-anchor="start" font-size="12.5" fill="#5b6678" font-weight="400" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif">ヘッダが無ければ次のクラスへ進む。ヘッダがあって不正なら、そこで 401(次へは進まない)。</text><text x="40" y="960.0" text-anchor="start" font-size="12.5" fill="#5b6678" font-weight="400" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif">取り込み API は IngestApiKeyAuthentication だけ。セッションやトークンでは通らず、キーでは画面の API に入れない。</text></svg>
